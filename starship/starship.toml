surface2 = "#414868"

overlay0 = "#565f89"
overlay1 = "#737aa2"
overlay2 = "#9aa5ce"

# --- text ---
text = "#c0caf5"
subtext0 = "#a9b1d6"
subtext1 = "#c0caf5"

# --- accents tokyonight ---
rosewater = "#c0caf5"
flamingo = "#ff9e64"
pink = "#f7768e"
